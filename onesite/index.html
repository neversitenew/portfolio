<!-- CarScene: procedural 3D cars (original designs) rendered with Three.js, rotatable with OrbitControls -->
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const BUILDS = {
  gt: {
    length: 4.84, width: 1.95, wheelR: 0.36, tireW: 0.27, axle: 1.45, bevel: 0.1,
    arch: 0.48, archY: 0.36, sill: 0.30, front: [2.35, 0.34], rear: [-2.35, 0.32],
    mirror: [0.86, 0.92], seams: [0.92, -0.62], seamTop: 0.82, handles: [0.05],
    rim: 0x2b2e33, cladding: false, glassOpacity: 0.5,
    cabin: { base: 0.86, z: 0.33, seats: [[-0.15, 0.68], [-1.15, 0.5]], dash: [0.62, 0.9], wheel: [0.42, 1.0] },
    body(s){
      s.moveTo(-2.35, 0.32); s.lineTo(-1.95, 0.30);
      s.absarc(-1.45, 0.36, 0.48, Math.PI, 0, true);
      s.lineTo(0.97, 0.30);
      s.absarc(1.45, 0.36, 0.48, Math.PI, 0, true);
      s.lineTo(2.35, 0.34); s.lineTo(2.42, 0.48); s.lineTo(2.36, 0.62);
      s.quadraticCurveTo(1.6, 0.74, 0.95, 0.84);
      s.lineTo(-1.2, 0.92);
      s.quadraticCurveTo(-2.1, 0.94, -2.38, 0.84);
      s.lineTo(-2.42, 0.6); s.lineTo(-2.35, 0.32);
    },
    glass(s){
      s.moveTo(1.0, 0.82); s.quadraticCurveTo(0.5, 1.12, 0.1, 1.24);
      s.lineTo(-0.6, 1.27); s.quadraticCurveTo(-1.5, 1.2, -2.05, 0.9);
      s.lineTo(-1.2, 0.88); s.lineTo(1.0, 0.82);
    },
    glassW: 1.42, glassBevel: 0.07,
    head: [2.37, 0.6, 1.55], tail: [-2.43, 0.8, 1.7]
  },
  cross: {
    length: 4.88, width: 1.98, wheelR: 0.4, tireW: 0.3, axle: 1.45, bevel: 0.1,
    arch: 0.52, archY: 0.42, sill: 0.42, front: [2.35, 0.45], rear: [-2.35, 0.45],
    mirror: [0.98, 1.08], seams: [0.86, -0.12, -1.05], seamTop: 0.98, handles: [0.3, -0.72],
    rim: 0xb7bcc4, cladding: true, glassOpacity: 0.5,
    cabin: { base: 1.07, z: 0.36, seats: [[0.0, 0.8], [-1.2, 0.8]], dash: [0.75, 1.12], wheel: [0.55, 1.24] },
    body(s){
      s.moveTo(-2.35, 0.45); s.lineTo(-1.95, 0.42);
      s.absarc(-1.45, 0.42, 0.52, Math.PI, 0, true);
      s.lineTo(0.93, 0.42);
      s.absarc(1.45, 0.42, 0.52, Math.PI, 0, true);
      s.lineTo(2.35, 0.45); s.lineTo(2.42, 0.62); s.lineTo(2.36, 0.84);
      s.quadraticCurveTo(1.7, 0.98, 1.05, 1.04);
      s.lineTo(-1.9, 1.1);
      s.quadraticCurveTo(-2.35, 1.1, -2.4, 0.95);
      s.lineTo(-2.42, 0.6); s.lineTo(-2.35, 0.45);
    },
    glass(s){
      s.moveTo(1.1, 1.0); s.quadraticCurveTo(0.6, 1.4, 0.25, 1.58);
      s.lineTo(-1.5, 1.6); s.quadraticCurveTo(-2.05, 1.55, -2.2, 1.06);
      s.lineTo(1.1, 1.0);
    },
    glassW: 1.56, glassBevel: 0.08,
    head: [2.37, 0.84, 1.6], tail: [-2.44, 0.95, 1.7]
  }
};

function extrude(draw, width, bevel){
  const shape = new THREE.Shape(); draw(shape);
  const depth = Math.max(0.01, width - 2 * bevel);
  const g = new THREE.ExtrudeGeometry(shape, {
    depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 10, curveSegments: 48
  });
  g.translate(0, 0, -depth / 2);
  g.computeVertexNormals();
  return g;
}

function mount(container, opts = {}){
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);
  renderer.domElement.setAttribute("aria-label", "3D-модель автомобиля. Потяните, чтобы повернуть");

  const scene = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

  const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
  camera.position.set(6.4, 2.3, 7.2);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.75, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.enablePan = false;
  controls.minDistance = 5;
  controls.maxDistance = 13;
  controls.minPolarAngle = 0.55;
  controls.maxPolarAngle = 1.48;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  controls.autoRotate = !reduce;
  controls.autoRotateSpeed = 0.9;
  let resumeTimer = 0;
  controls.addEventListener("start", () => { controls.autoRotate = false; clearTimeout(resumeTimer); });
  controls.addEventListener("end", () => { clearTimeout(resumeTimer); if (!reduce) resumeTimer = setTimeout(() => { controls.autoRotate = true; }, 4000); });

  scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x08080a, 0.4));
  const key = new THREE.DirectionalLight(0xffffff, 2.4);
  key.position.set(4, 8, 5); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  Object.assign(key.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 1, far: 25 });
  key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02; key.shadow.radius = 6;
  scene.add(key);
  const rim = new THREE.DirectionalLight(0x9db8ff, 1.6); rim.position.set(-6, 3, -5); scene.add(rim);
  const front = new THREE.DirectionalLight(0xffffff, 0.7); front.position.set(6, 2, -2); scene.add(front);

  const floor = new THREE.Mesh(new THREE.CircleGeometry(9, 96), new THREE.MeshStandardMaterial({ color: 0x0c0c0f, roughness: 0.42, metalness: 0.3 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  const ring = new THREE.Mesh(new THREE.RingGeometry(3.55, 3.58, 160), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.22 }));
  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.003; scene.add(ring);

  // Materials
  const paint = new THREE.MeshPhysicalMaterial({ color: 0x1f4fd1, metalness: 0.6, roughness: 0.28, clearcoat: 1, clearcoatRoughness: 0.05 });
  const accent = new THREE.MeshPhysicalMaterial({ color: 0xc8ff2e, emissive: 0xc8ff2e, emissiveIntensity: 0.18, metalness: 0.25, roughness: 0.35, clearcoat: 0.8 });
  const glassMat = new THREE.MeshPhysicalMaterial({
    color: 0x4f9fd0, emissive: 0x4f9fd0, emissiveIntensity: 0.1, metalness: 0.1, roughness: 0.05,
    clearcoat: 1, clearcoatRoughness: 0.02, envMapIntensity: 1.8,
    transparent: true, opacity: 0.5, side: THREE.DoubleSide, depthWrite: false
  });
  const trim = new THREE.MeshPhysicalMaterial({ color: 0x0c0d0f, metalness: 0.2, roughness: 0.35, clearcoat: 0.6 });
  const tireMat = new THREE.MeshStandardMaterial({ color: 0x141416, roughness: 0.9, side: THREE.DoubleSide });
  const rimMat = new THREE.MeshPhysicalMaterial({ color: 0x2b2e33, metalness: 0.9, roughness: 0.22, clearcoat: 0.5 });
  const steel = new THREE.MeshStandardMaterial({ color: 0xc9ccd2, metalness: 1, roughness: 0.18 });
  const discMat = new THREE.MeshStandardMaterial({ color: 0x6d7075, metalness: 0.85, roughness: 0.45 });
  const barrelMat = new THREE.MeshStandardMaterial({ color: 0x1a1b1e, metalness: 0.6, roughness: 0.5, side: THREE.DoubleSide });
  const seatMat = new THREE.MeshStandardMaterial({ color: 0xd8cdb8, roughness: 0.65 });
  const darkInt = new THREE.MeshStandardMaterial({ color: 0x1b1c20, roughness: 0.6 });
  const headMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 3 });
  const tailMat = new THREE.MeshStandardMaterial({ color: 0xff2a2a, emissive: 0xff1a1a, emissiveIntensity: 3.2 });

  const add = (parent, geo, mat, x = 0, y = 0, z = 0, shadow = true) => {
    const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
    if (shadow) m.castShadow = true;
    parent.add(m); return m;
  };

  function wheel(r, w, side){
    const g = new THREE.Group();
    const rr = r * 0.72;           // rim radius
    const faceZ = side * (w / 2);  // outer face
    // Tire with rounded sidewalls
    const prof = [
      [rr * 0.98, -w / 2], [r * 0.9, -w / 2], [r * 0.975, -w * 0.43], [r, -w * 0.28],
      [r, w * 0.28], [r * 0.975, w * 0.43], [r * 0.9, w / 2], [rr * 0.98, w / 2]
    ].map(([a, b]) => new THREE.Vector2(a, b));
    const tire = add(g, new THREE.LatheGeometry(prof, 72), tireMat);
    tire.rotation.x = Math.PI / 2;
    // Rim barrel + polished lip + accent pinstripe
    const barrel = add(g, new THREE.CylinderGeometry(rr, rr, w * 0.92, 48, 1, true), barrelMat, 0, 0, 0, false);
    barrel.rotation.x = Math.PI / 2;
    add(g, new THREE.TorusGeometry(rr, r * 0.028, 12, 72), steel, 0, 0, faceZ - side * 0.004, false);
    add(g, new THREE.TorusGeometry(rr * 0.93, r * 0.012, 8, 72), accent, 0, 0, faceZ - side * 0.012, false);
    // Brake disc + accent caliper behind the spokes
    const disc = add(g, new THREE.CylinderGeometry(rr * 0.8, rr * 0.8, 0.028, 48), discMat, 0, 0, faceZ - side * 0.13, false);
    disc.rotation.x = Math.PI / 2;
    add(g, new THREE.CylinderGeometry(r * 0.2, r * 0.2, 0.05, 24), barrelMat, 0, 0, faceZ - side * 0.1, false).rotation.x = Math.PI / 2;
    const cal = add(g, new THREE.TorusGeometry(rr * 0.72, r * 0.075, 10, 24, Math.PI * 0.42), accent, 0, 0, faceZ - side * 0.1, false);
    cal.scale.z = 1.4; cal.rotation.z = Math.PI * 0.28;
    // 5 twin spokes, tapered and bevelled
    const sp = new THREE.Shape();
    sp.moveTo(r * 0.15, -r * 0.055); sp.lineTo(rr * 0.97, -r * 0.03); sp.lineTo(rr * 0.97, r * 0.03); sp.lineTo(r * 0.15, r * 0.055); sp.lineTo(r * 0.15, -r * 0.055);
    const spGeo = new THREE.ExtrudeGeometry(sp, { depth: 0.03, bevelEnabled: true, bevelThickness: 0.008, bevelSize: 0.006, bevelSegments: 3 });
    spGeo.translate(0, 0, -0.015);
    for (let k = 0; k < 5; k++) for (const d of [-0.13, 0.13]){
      const s = add(g, spGeo, rimMat, 0, 0, faceZ - side * 0.03, false);
      s.rotation.z = (k / 5) * Math.PI * 2 + d;
    }
    // Hub, lug nuts and accent centre badge
    const hub = add(g, new THREE.CylinderGeometry(r * 0.17, r * 0.19, 0.05, 32), rimMat, 0, 0, faceZ - side * 0.02, false);
    hub.rotation.x = Math.PI / 2;
    for (let k = 0; k < 5; k++){
      const a = (k / 5) * Math.PI * 2 + Math.PI / 5;
      const n = add(g, new THREE.CylinderGeometry(r * 0.022, r * 0.022, 0.03, 6), steel, Math.cos(a) * r * 0.11, Math.sin(a) * r * 0.11, faceZ + side * 0.005, false);
      n.rotation.x = Math.PI / 2;
    }
    const badge = add(g, new THREE.CylinderGeometry(r * 0.06, r * 0.06, 0.012, 24), accent, 0, 0, faceZ + side * 0.006, false);
    badge.rotation.x = Math.PI / 2;
    return g;
  }

  function seat(parent, x, base, z, s){
    const g = new THREE.Group(); g.position.set(x, base, z); g.scale.setScalar(s);
    add(g, new THREE.BoxGeometry(0.48, 0.1, 0.44), seatMat, 0, 0.05, 0, false);
    const back = add(g, new THREE.BoxGeometry(0.11, 0.42, 0.44), seatMat, -0.23, 0.26, 0, false); back.rotation.z = 0.25;
    const stripe = add(g, new THREE.BoxGeometry(0.115, 0.42, 0.06), accent, -0.23, 0.26, 0, false); stripe.rotation.z = 0.25;
    const head = add(g, new THREE.BoxGeometry(0.09, 0.11, 0.24), darkInt, -0.3, 0.52, 0, false); head.rotation.z = 0.25;
    parent.add(g);
  }

  function buildCar(id){
    const b = BUILDS[id];
    const car = new THREE.Group();
    const W = b.width / 2;
    const body = new THREE.Mesh(extrude(b.body, b.width, b.bevel), paint);
    body.castShadow = true; body.receiveShadow = true; car.add(body);
    const glass = new THREE.Mesh(extrude(b.glass, b.glassW, b.glassBevel), glassMat);
    glass.renderOrder = 2; car.add(glass);

    // Interior seen through the tinted glass
    if (b.cabin){
      const c = b.cabin;
      for (const [sx, ss] of c.seats) for (const zs of [-1, 1]) seat(car, sx, c.base, zs * c.z, ss);
      add(car, new THREE.BoxGeometry(0.3, 0.08, b.glassW * 0.9), darkInt, c.dash[0], c.dash[1], 0, false);
      add(car, new THREE.BoxGeometry(0.02, 0.012, b.glassW * 0.8), accent, c.dash[0] - 0.15, c.dash[1] + 0.02, 0, false);
      const sw = add(car, new THREE.TorusGeometry(0.11, 0.016, 10, 32), darkInt, c.wheel[0], c.wheel[1], c.z, false);
      sw.rotation.y = Math.PI / 2; sw.rotation.x = 0; sw.rotation.z = 0;
    }

    // Lights with dark housings
    const [hx, hy, hw] = b.head, [tx, ty, tw] = b.tail;
    add(car, new THREE.BoxGeometry(0.05, 0.035, hw), headMat, hx, hy, 0, false);
    for (const zs of [-1, 1]){
      add(car, new THREE.BoxGeometry(0.04, 0.07, 0.34), trim, hx - 0.012, hy - 0.05, zs * (hw / 2 - 0.2), false);
      add(car, new THREE.BoxGeometry(0.045, 0.02, 0.22), headMat, hx - 0.008, hy - 0.05, zs * (hw / 2 - 0.2), false);
    }
    add(car, new THREE.BoxGeometry(0.05, 0.045, tw), tailMat, tx, ty, 0, false);
    add(car, new THREE.BoxGeometry(0.04, 0.012, tw * 0.6), accent, tx + 0.005, ty - 0.07, 0, false);

    // Front splitter with accent edge, rear diffuser with fins
    const [fx, fy] = b.front, [rx, ry] = b.rear;
    add(car, new THREE.BoxGeometry(0.36, 0.04, b.width * 0.92), trim, fx - 0.16, fy - 0.01, 0);
    add(car, new THREE.BoxGeometry(0.02, 0.014, b.width * 0.9), accent, fx + 0.025, fy - 0.01, 0, false);
    add(car, new THREE.BoxGeometry(0.32, 0.08, b.width * 0.8), trim, rx + 0.12, ry + 0.02, 0);
    for (let k = -2; k <= 2; k++) add(car, new THREE.BoxGeometry(0.3, 0.1, 0.015), trim, rx + 0.1, ry, k * b.width * 0.14, false);

    // Side skirts with accent stripe, cladding, mirrors, door seams, handles
    const skL = 2 * b.axle - 2 * b.arch - 0.06;
    for (const zs of [-1, 1]){
      add(car, new THREE.BoxGeometry(skL, 0.09, 0.05), trim, 0, b.sill + 0.03, zs * (W + 0.01));
      add(car, new THREE.BoxGeometry(skL * 0.92, 0.014, 0.012), accent, 0, b.sill + 0.08, zs * (W + 0.036), false);
      if (b.cladding) for (const ax of [-b.axle, b.axle]){
        add(car, new THREE.TorusGeometry(b.arch + 0.015, 0.04, 8, 48, Math.PI), trim, ax, b.archY, zs * (W - 0.02), false).scale.z = 1.6;
      }
      for (const sx of b.seams){
        add(car, new THREE.BoxGeometry(0.008, b.seamTop - b.sill - 0.12, 0.006), trim, sx, (b.seamTop + b.sill + 0.12) / 2, zs * (W + 0.002), false);
      }
      for (const hxp of b.handles){
        add(car, new THREE.BoxGeometry(0.18, 0.026, 0.012), steel, hxp, b.seamTop - 0.1, zs * (W + 0.004), false);
      }
      const [mx, my] = b.mirror;
      add(car, new THREE.BoxGeometry(0.07, 0.03, 0.16), trim, mx, my - 0.03, zs * (W + 0.02), false);
      const housing = add(car, new THREE.SphereGeometry(1, 24, 16), accent, mx - 0.02, my, zs * (W + 0.12));
      housing.scale.set(0.12, 0.065, 0.1);
      const face = add(car, new THREE.SphereGeometry(1, 24, 16), trim, mx - 0.07, my, zs * (W + 0.12), false);
      face.scale.set(0.06, 0.055, 0.085);
    }

    // Wheels
    const zOff = W - b.tireW / 2 + 0.01;
    rimMat.color.setHex(b.rim);
    for (const ax of [-b.axle, b.axle]) for (const side of [-1, 1]){
      const wh = wheel(b.wheelR, b.tireW, side);
      wh.position.set(ax, b.wheelR, side * zOff);
      car.add(wh);
    }
    glassMat.opacity = b.glassOpacity;
    return car;
  }

  let car = null, alive = true;
  function setModel(id){
    if (car){
      scene.remove(car);
      car.traverse(o => { if (o.isMesh) o.geometry.dispose(); });
    }
    car = buildCar(id);
    car.scale.setScalar(0.92);
    scene.add(car);
    grow = 0;
  }
  let grow = 1;
  function setColor(hex){ paint.color.set(hex); }
  function setAccent(hex){ accent.color.set(hex); accent.emissive.set(hex); }
  function setTint(hex){ glassMat.color.set(hex); glassMat.emissive.set(hex); }

  function resize(){
    const w = container.clientWidth, h = container.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = camera.aspect < 0.9 ? 44 : 32;
    camera.updateProjectionMatrix();
  }
  const ro = new ResizeObserver(resize); ro.observe(container);

  let visible = true;
  const io = new IntersectionObserver(([e]) => { visible = e.isIntersecting; }, { rootMargin: "120px" });
  io.observe(container);

  renderer.setAnimationLoop(() => {
    if (!alive || !visible) return;
    if (car && grow < 1){ grow = Math.min(1, grow + 0.06); car.scale.setScalar(0.92 + 0.08 * (1 - Math.pow(1 - grow, 3))); }
    controls.update();
    renderer.render(scene, camera);
  });

  setModel(opts.model || "gt");
  if (opts.color) setColor(opts.color);
  if (opts.accent) setAccent(opts.accent);
  if (opts.tint) setTint(opts.tint);
  resize();

  return {
    setModel, setColor, setAccent, setTint,
    dispose(){
      alive = false; renderer.setAnimationLoop(null); ro.disconnect(); io.disconnect();
      controls.dispose(); renderer.dispose(); renderer.domElement.remove();
    }
  };
}

window.CarScene = { mount };
window.dispatchEvent(new Event("carscene-ready"));
</script>

<script type="text/babel" data-presets="react">
  const FADE_MS = 900;
  const VERT = "attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";

  function ShaderBackground({ frag }) {
    const ref = React.useRef(null);
    React.useEffect(() => {
      const canvas = ref.current;
      if (!canvas) return;
      canvas.style.opacity = "0";
      const gl = canvas.getContext("webgl", { antialias: false });
      if (!gl) return;
      const compile = (type, src) => {
        const s = gl.createShader(type);
        gl.shaderSource(s, src); gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.warn(gl.getShaderInfoLog(s));
        return s;
      };
      const prog = gl.createProgram();
      gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
      gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, frag));
      gl.linkProgram(prog); gl.useProgram(prog);
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(prog, "p");
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      const uR = gl.getUniformLocation(prog, "r"), uT = gl.getUniformLocation(prog, "t");
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let raf = 0, fadeRaf = 0, visible = true, faded = false;
      const t0 = performance.now();
      const resize = () => {
        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        const w = Math.max(1, Math.round(canvas.clientWidth * dpr)), h = Math.max(1, Math.round(canvas.clientHeight * dpr));
        if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
        gl.viewport(0, 0, w, h);
      };
      const fadeIn = () => {
        const start = performance.now();
        const step = (now) => { const k = Math.min(1, (now - start) / FADE_MS); canvas.style.opacity = String(k); if (k < 1) fadeRaf = requestAnimationFrame(step); };
        fadeRaf = requestAnimationFrame(step);
      };
      const draw = (now) => {
        resize();
        gl.uniform2f(uR, canvas.width, canvas.height);
        gl.uniform1f(uT, reduce ? 14.0 : (now - t0) / 1000);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        if (!faded) { faded = true; fadeIn(); }
      };
      const loop = (now) => { draw(now); if (visible && !reduce) raf = requestAnimationFrame(loop); };
      const io = new IntersectionObserver(([e]) => { visible = e.isIntersecting; cancelAnimationFrame(raf); if (visible) raf = requestAnimationFrame(loop); }, { rootMargin: "100px" });
      io.observe(canvas);
      const ro = new ResizeObserver(() => { if (reduce || !visible) draw(performance.now()); });
      ro.observe(canvas);
      return () => { cancelAnimationFrame(raf); cancelAnimationFrame(fadeRaf); io.disconnect(); ro.disconnect(); gl.deleteBuffer(buf); gl.deleteProgram(prog); };
    }, [frag]);
    return <canvas ref={ref} aria-hidden="true" style={{ width: "100%", height: "100%", display: "block" }} />;
  }

  const ROAD_FRAG = `
precision highp float;
uniform vec2 r; uniform float t;
float h1(float n){return fract(sin(n)*43758.5453);}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*r)/r.y;
  uv.y-=0.08;
  vec3 col=vec3(0.006,0.008,0.016);
  float hor=0.0;
  col+=vec3(0.10,0.14,0.26)*exp(-abs(uv.y-hor)*9.0)*0.55;
  col+=vec3(0.55,0.35,0.25)*exp(-abs(uv.y-hor)*60.0)*0.10*smoothstep(1.2,0.,abs(uv.x));
  if(uv.y>hor){
    vec2 s=floor(gl_FragCoord.xy/2.);
    float st=step(0.9975,h1(s.x*13.1+s.y*71.7));
    col+=vec3(0.7,0.8,1.0)*st*(0.35+0.35*sin(t*2.+s.x))*smoothstep(0.02,0.25,uv.y);
  } else {
    float d=hor-uv.y;
    float z=0.9/d;
    float x=uv.x*z;
    float fade=smoothstep(160.,10.,z);
    for(int i=0;i<8;i++){
      float fi=float(i);
      bool toward=i<4;
      float lane=toward? -1.75+fi*0.4 : 0.3+(fi-4.)*0.4;
      float spd=toward? 55.0+h1(fi)*20.0 : 32.0+h1(fi)*14.0;
      float ph=toward? (z+t*spd) : (z-t*spd);
      float seg=fract(ph*0.014+h1(fi*3.7));
      float dash=smoothstep(0.0,0.05,seg)*smoothstep(0.62,0.18,seg);
      float w=exp(-pow((x-lane)*9.0,2.0));
      float core=exp(-pow((x-lane)*26.0,2.0));
      vec3 c=toward? vec3(0.80,0.88,1.0) : vec3(1.0,0.10,0.06);
      col+=c*(w*0.55+core*1.2)*dash*fade;
    }
    float edge=exp(-pow((abs(x)-2.15)*14.0,2.0))*0.3+exp(-pow(x*40.0,2.0))*0.35*step(0.55,fract(z*0.05+t*2.2));
    col+=vec3(0.75,0.8,0.9)*edge*fade;
    col+=vec3(0.025,0.03,0.05)*smoothstep(2.4,0.,abs(x))*smoothstep(120.,3.,z);
  }
  col*=1.0-0.55*dot(uv*vec2(0.6,1.0),uv*vec2(0.6,1.0));
  gl_FragColor=vec4(pow(max(col,0.),vec3(0.92)),1.0);
}`;

  const ENERGY_FRAG = `
precision highp float;
uniform vec2 r; uniform float t;
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*r)/r.y;
  vec3 col=vec3(0.004,0.006,0.012);
  for(int i=0;i<9;i++){
    float fi=float(i);
    float off=(fi-4.0)*0.075;
    float y=off+0.12*sin(uv.x*(1.1+fi*0.07)+t*0.35+fi*1.7)*cos(uv.x*0.6-t*0.2+fi);
    float d=abs(uv.y-y);
    float glow=0.0016/(d+0.0025);
    float pulse=exp(-pow(fract(uv.x*0.18-t*(0.10+fi*0.012)+fi*0.31)-0.5,2.0)*180.0);
    vec3 c=mix(vec3(0.35,0.55,1.0),vec3(0.95,0.97,1.0),fi/8.0);
    col+=c*glow*(0.35+1.6*pulse);
  }
  col+=vec3(0.06,0.09,0.2)*exp(-length(uv*vec2(0.7,1.6))*2.2);
  col*=1.0-0.45*dot(uv*vec2(0.5,0.9),uv*vec2(0.5,0.9));
  gl_FragColor=vec4(pow(max(col,0.),vec3(0.95)),1.0);
}`;

  Object.assign(window, { ShaderBackground, ROAD_FRAG, ENERGY_FRAG });
</script>

<script type="text/babel" data-presets="react">
  function BlurText({ text, className = "", as = "p" }) {
    const { motion } = window.Motion;
    const ref = React.useRef(null);
    const [inView, setInView] = React.useState(false);
    React.useEffect(() => {
      const el = ref.current;
      if (!el) return;
      const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setInView(true); io.disconnect(); } }, { threshold: 0.1 });
      io.observe(el);
      return () => io.disconnect();
    }, []);
    const Tag = as;
    return (
      <Tag ref={ref} className={className} aria-label={text} style={{ display: "flex", flexWrap: "wrap", justifyContent: "center", rowGap: "0.1em" }}>
        {text.split(" ").map((word, i) => (
          <motion.span key={word + i} aria-hidden="true"
            initial={{ filter: "blur(10px)", opacity: 0, y: 50 }}
            animate={inView ? { filter: ["blur(10px)", "blur(5px)", "blur(0px)"], opacity: [0, 0.5, 1], y: [50, -5, 0] } : { filter: "blur(10px)", opacity: 0, y: 50 }}
            transition={{ duration: 0.7, times: [0, 0.5, 1], ease: "easeOut", delay: (i * 100) / 1000 }}
            style={{ display: "inline-block", marginRight: "0.28em" }}>{word}</motion.span>
        ))}
      </Tag>
    );
  }
  function Reveal({ children, delay = 0, className = "" }) {
    const { motion } = window.Motion;
    return (
      <motion.div className={className}
        initial={{ filter: "blur(10px)", opacity: 0, y: 24 }}
        whileInView={{ filter: "blur(0px)", opacity: 1, y: 0 }}
        viewport={{ once: true, amount: 0.15 }}
        transition={{ duration: 0.8, delay, ease: "easeOut" }}>{children}</motion.div>
    );
  }
  function SectionHead({ kicker, title }) {
    return (
      <Reveal>
        <p className="text-sm md:text-base font-body text-white/70 mb-5">// {kicker}</p>
        <h2 className="font-heading italic font-normal text-white text-5xl sm:text-6xl md:text-7xl lg:text-[6.5rem] leading-[0.95] tracking-[-2px]">{title}</h2>
      </Reveal>
    );
  }
  Object.assign(window, { BlurText, Reveal, SectionHead });
</script>

      window.addEventListener("resize", onScroll);

<script type="text/babel" data-presets="react">
  function hslToHex(h, s, l){
    s /= 100; l /= 100;
    const a = s * Math.min(l, 1 - l);
    const f = (n) => { const k = (n + h / 30) % 12; return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
    const t = (x) => Math.round(x * 255).toString(16).padStart(2, "0");
    return "#" + t(f(0)) + t(f(8)) + t(f(4));
  }
  function Swatches({ label, list, cur, custom, onPick, onCustom, size }) {
    const [open, setOpen] = React.useState(false);
    const [hsl, setHsl] = React.useState([200, 80, 50]);
    const isCustom = cur === -1;
    const hex = hslToHex(hsl[0], hsl[1], hsl[2]);
    const setPart = (i, v) => { const n = hsl.slice(); n[i] = Number(v); setHsl(n); onCustom(hslToHex(n[0], n[1], n[2])); };
    const dim = size === "sm" ? "h-9 w-9 " : "h-11 w-11 ";
    const ring = (on) => on ? "ring-2 ring-white ring-offset-4 ring-offset-black" : "ring-1 ring-white/30";
    const tracks = [
      ["Оттенок", 0, 360, "linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)"],
      ["Насыщенность", 0, 100, `linear-gradient(90deg,${hslToHex(hsl[0], 0, hsl[2])},${hslToHex(hsl[0], 100, hsl[2])})`],
      ["Яркость", 0, 100, `linear-gradient(90deg,#000,${hslToHex(hsl[0], hsl[1], 50)},#fff)`]
    ];
    return (
      <div className={size === "sm" ? "mt-5" : ""}>
        <div className="flex items-baseline justify-between gap-3">
          <span className="text-sm text-white/60">{label}</span>
          <span className="text-base text-right">{isCustom ? "Свой " + (custom || hex).toUpperCase() : list[cur].name}</span>
        </div>
        <div className="mt-3 flex flex-wrap gap-3" role="radiogroup" aria-label={label}>
          {list.map((c, i) => (
            <button key={c.hex} type="button" role="radio" aria-checked={i === cur} aria-label={c.name} title={c.name}
              onClick={() => { setOpen(false); onPick(i); }}
              className={dim + "rounded-full transition-transform hover:scale-110 " + ring(i === cur)}
              style={{ background: c.hex }} />
          ))}
          <button type="button" role="radio" aria-checked={isCustom} aria-expanded={open} aria-label="Свой цвет" title="Свой цвет"
            onClick={() => { const nx = !open; setOpen(nx); if (nx) onCustom(hex); }}
            className={dim + "rounded-full transition-transform hover:scale-110 " + ring(isCustom)}
            style={{ background: "conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)" }} />
        </div>
        {open ? (
          <div className="mt-4 liquid-glass rounded-2xl p-4 grid gap-4">
            <div className="flex items-center gap-3">
              <span className="h-9 w-9 rounded-full ring-1 ring-white/40 shrink-0" style={{ background: hex }}></span>
              <span className="text-base font-body tabular-nums">{hex.toUpperCase()}</span>
              <button type="button" onClick={() => setOpen(false)} className="ml-auto text-sm text-white/75 hover:text-white">Готово</button>
            </div>
            {tracks.map(([name, min, max, bg], i) => (
              <label key={name} className="grid gap-2">
                <span className="text-sm text-white/60">{name}</span>
                <input type="range" min={min} max={max} value={hsl[i]} onChange={(e) => setPart(i, e.target.value)}
                  className="cr" style={{ background: bg }} aria-label={label + ": " + name} />
              </label>
            ))}
          </div>
        ) : null}
      </div>
    );
  }

  function Models() {
    const [mi, setMi] = React.useState(0);
    const [ci, setCi] = React.useState(MODELS[0].color);
    const [ai, setAi] = React.useState(MODELS[0].accent);
    const [ti, setTi] = React.useState(MODELS[0].tint);
    const [cc, setCc] = React.useState(null);
    const [ac, setAc] = React.useState(null);
    const [tc, setTc] = React.useState(null);
    const [status, setStatus] = React.useState("loading");
    const viewerRef = React.useRef(null);
    const apiRef = React.useRef(null);
    const m = MODELS[mi];

    React.useEffect(() => {
      const el = viewerRef.current;
      let cancelled = false;
      const init = () => {
        if (cancelled || apiRef.current || !el) return;
        try {
          apiRef.current = window.CarScene.mount(el, { model: MODELS[0].id, color: COLORS[MODELS[0].color].hex, accent: ACCENTS[MODELS[0].accent].hex, tint: TINTS[MODELS[0].tint].hex });
          setStatus("ready");
        } catch (e) { setStatus("error"); }
      };
      if (window.CarScene) init(); else window.addEventListener("carscene-ready", init, { once: true });
      const fail = setTimeout(() => { if (!apiRef.current && !cancelled) setStatus("error"); }, 15000);
      return () => { cancelled = true; clearTimeout(fail); window.removeEventListener("carscene-ready", init); if (apiRef.current) { apiRef.current.dispose(); apiRef.current = null; } };
    }, []);

    const pickModel = (i) => {
      setMi(i);
      const { color: c, accent: a, tint: t } = MODELS[i];
      setCi(c); setAi(a); setTi(t);
      const api = apiRef.current;
      if (api) { api.setModel(MODELS[i].id); api.setColor(COLORS[c].hex); api.setAccent(ACCENTS[a].hex); api.setTint(TINTS[t].hex); }
    };
    const pickColor = (i) => { setCi(i); if (apiRef.current) apiRef.current.setColor(COLORS[i].hex); };
    const pickAccent = (i) => { setAi(i); if (apiRef.current) apiRef.current.setAccent(ACCENTS[i].hex); };
    const pickTint = (i) => { setTi(i); if (apiRef.current) apiRef.current.setTint(TINTS[i].hex); };
    const customColor = (h) => { setCi(-1); setCc(h); if (apiRef.current) apiRef.current.setColor(h); };
    const customAccent = (h) => { setAi(-1); setAc(h); if (apiRef.current) apiRef.current.setAccent(h); };
    const customTint = (h) => { setTi(-1); setTc(h); if (apiRef.current) apiRef.current.setTint(h); };

    const specs = [["Запас хода", m.range + " км"], ["0–100 км/ч", m.accel], ["Мощность", m.power], ["Батарея", m.battery + " кВт·ч"]];

    return (
      <section id="models" className="relative bg-black overflow-hidden">
        <div className="absolute inset-0 pointer-events-none" aria-hidden="true"
          style={{ background: "radial-gradient(60% 50% at 50% 55%, rgba(80,110,200,0.16), rgba(0,0,0,0) 70%)" }}></div>
        <div className="relative px-4 md:px-16 lg:px-20 pt-28 pb-24">
          <div className="flex flex-wrap items-end justify-between gap-6">
            <SectionHead kicker="Модели" title={<>Два характера,<br />одна платформа</>} />
            <Reveal delay={0.2} className="max-w-md">
              <p className="text-base md:text-lg text-white/85 leading-snug">Выберите модель, цвет кузова, акценты и тонировку. Радужный кружок открывает свою палитру. Машину можно крутить мышью или пальцем, колесом мыши — приблизить.</p>
            </Reveal>
          </div>

          <div role="tablist" aria-label="Модели" className="mt-12 flex flex-wrap gap-2">
            {MODELS.map((x, i) => (
              <button key={x.id} role="tab" aria-selected={i === mi} type="button" onClick={() => pickModel(i)}
                className={"rounded-full px-5 py-3 text-base font-medium transition-colors " + (i === mi ? "bg-white text-black" : "liquid-glass text-white/90 hover:text-white")}>
                {x.name}
              </button>
            ))}
          </div>

          <div className="mt-6 grid grid-cols-1 xl:grid-cols-[minmax(0,1fr)_380px] gap-6">
            <div className="flex flex-col gap-4 min-w-0">
            <div className="liquid-glass rounded-[1.75rem] relative min-w-0 flex-1 min-h-[min(115vw,520px)] md:min-h-[600px]">
              <div ref={viewerRef} className="viewer absolute inset-0"></div>
              {status !== "ready" ? (
                <div className="absolute inset-0 grid place-items-center text-center px-6 text-white/70 text-base pointer-events-none">
                  {status === "error" ? "3D-модель не загрузилась в этом браузере. Характеристики справа работают." : "Выкатываем машину из гаража…"}
                </div>
              ) : null}
              <div className="absolute left-5 top-5 md:left-7 md:top-7 pointer-events-none">
                <div className="font-heading italic text-4xl md:text-6xl leading-none">{m.name}</div>
                <div className="mt-2 text-sm md:text-base text-white/75">{m.kind}</div>
              </div>
              <div className="absolute left-5 bottom-5 md:left-7 md:bottom-7 liquid-glass rounded-full px-4 py-2 text-sm text-white/85 pointer-events-none">
                Потяните, чтобы повернуть
              </div>
            </div>
              <div className="liquid-glass rounded-[1.5rem] p-6 flex items-end justify-between gap-4">
                <div>
                  <div className="text-sm text-white/60">Цена</div>
                  <div className="font-heading italic text-3xl md:text-5xl leading-none mt-1">{m.price}</div>
                </div>
                <a href="#charging" className="text-sm text-white/85 hover:text-white inline-flex items-center gap-1.5 whitespace-nowrap">Сколько заряжать <ArrowUpRight /></a>
              </div>
            </div>

            <div className="flex flex-col gap-4 min-w-0">
              <div className="liquid-glass rounded-[1.5rem] p-6">
                <p className="text-base text-white/85 leading-snug">{m.tagline}</p>
                <dl className="mt-5 grid grid-cols-2 gap-x-4 gap-y-5">
                  {specs.map(([k, v]) => (
                    <div key={k}>
                      <dt className="text-sm text-white/60">{k}</dt>
                      <dd className="font-heading italic text-3xl leading-none mt-1">{v}</dd>
                    </div>
                  ))}
                </dl>
              </div>
              <div className="liquid-glass rounded-[1.5rem] p-6">
                <Swatches label="Цвет кузова" list={COLORS} cur={ci} custom={cc} onPick={pickColor} onCustom={customColor} />
                <Swatches label="Акценты: суппорты, зеркала, полосы" list={ACCENTS} cur={ai} custom={ac} onPick={pickAccent} onCustom={customAccent} size="sm" />
                <Swatches label="Тонировка стёкол" list={TINTS} cur={ti} custom={tc} onPick={pickTint} onCustom={customTint} size="sm" />
              </div>
            </div>
          </div>
        </div>
      </section>
    );
  }
  window.Models = Models;
</script>

<script type="text/babel" data-presets="react">
  const STATIONS = [
    { kw: 11, name: "Дома", note: "настенная станция" },
    { kw: 150, name: "В городе", note: "быстрая станция" },
    { kw: 350, name: "На трассе", note: "сверхбыстрая" }
  ];
  const TARIFF = 95; // ₸ за кВт·ч, демо-значение

  function Charging() {
    const [mi, setMi] = React.useState(1);
    const [si, setSi] = React.useState(2);
    const [from, setFrom] = React.useState(10);
    const [to, setTo] = React.useState(80);
    const m = MODELS[mi], st = STATIONS[si];
    const kwh = (m.battery * Math.max(0, to - from)) / 100;
    const effKw = Math.min(st.kw, m.maxKw) * (to > 80 ? 0.62 : 0.78);
    const minutes = kwh > 0 ? (kwh / effKw) * 60 : 0;
    const km = kwh / m.use;
    const cost = kwh * TARIFF;
    const timeLabel = minutes >= 90 ? `${Math.floor(minutes / 60)} ч ${Math.round(minutes % 60)} мин` : `${Math.round(minutes)} мин`;

    const onFrom = (v) => { const n = +v; setFrom(Math.min(n, to - 5)); };
    const onTo = (v) => { const n = +v; setTo(Math.max(n, from + 5)); };

    return (
      <section id="charging" className="relative bg-black overflow-hidden">
        <div className="absolute inset-0 pointer-events-none" aria-hidden="true"
          style={{ background: "radial-gradient(50% 60% at 85% 30%, rgba(90,130,255,0.14), rgba(0,0,0,0) 70%)" }}></div>
        <div className="relative px-4 md:px-16 lg:px-20 pt-28 pb-24 grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_minmax(0,560px)] gap-12 items-start">
          <div className="min-w-0">
            <SectionHead kicker="Зарядка" title={<>Посчитайте<br />свою зарядку</>} />
            <Reveal delay={0.2}>
              <p className="mt-8 text-base md:text-lg text-white/85 leading-snug max-w-xl">
                Выберите модель, станцию и уровень заряда. Калькулятор покажет время, сколько километров добавится и сколько это стоит.
              </p>
              <ul className="mt-8 grid gap-3 max-w-xl text-base">
                {["Домашняя станция 11 кВт входит в комплект", "Оплата на станциях партнёров прямо из машины", "Маршрут с зарядками строится в навигаторе сам"].map((t) => (
                  <li key={t} className="liquid-glass rounded-full px-5 py-3 flex items-center gap-3"><span className="text-white"><BoltIcon size={18} /></span>{t}</li>
                ))}
              </ul>
            </Reveal>
          </div>

          <Reveal delay={0.15} className="liquid-glass-strong rounded-[1.75rem] p-6 md:p-8 min-w-0">
            <form onSubmit={(e) => e.preventDefault()} aria-label="Калькулятор зарядки">
              <fieldset>
                <legend className="text-sm text-white/60 mb-3">Модель</legend>
                <div className="flex flex-wrap gap-2">
                  {MODELS.map((x, i) => (
                    <button key={x.id} type="button" aria-pressed={i === mi} onClick={() => setMi(i)}
                      className={"rounded-full px-4 py-2 text-[15px] font-medium " + (i === mi ? "bg-white text-black" : "liquid-glass text-white/90")}>{x.name}</button>
                  ))}
                </div>
              </fieldset>
              <fieldset className="mt-6">
                <legend className="text-sm text-white/60 mb-3">Станция</legend>
                <div className="grid grid-cols-3 gap-2">
                  {STATIONS.map((s, i) => (
                    <button key={s.kw} type="button" aria-pressed={i === si} onClick={() => setSi(i)}
                      className={"rounded-[1rem] px-3 py-3 text-left " + (i === si ? "bg-white text-black" : "liquid-glass text-white")}>
                      <div className="font-heading italic text-2xl leading-none">{s.kw} кВт</div>
                      <div className={"text-xs mt-1 " + (i === si ? "text-black/70" : "text-white/65")}>{s.name}</div>
                    </button>
                  ))}
                </div>
              </fieldset>
              <div className="mt-7">
                <div className="flex justify-between text-sm text-white/60"><label htmlFor="from">Заряд сейчас</label><output htmlFor="from" className="text-white text-base">{from}%</output></div>
                <input id="from" className="mt-3" type="range" min="0" max="95" step="5" value={from} onChange={(e) => onFrom(e.target.value)} />
              </div>
              <div className="mt-6">
                <div className="flex justify-between text-sm text-white/60"><label htmlFor="to">Зарядить до</label><output htmlFor="to" className="text-white text-base">{to}%</output></div>
                <input id="to" className="mt-3" type="range" min="5" max="100" step="5" value={to} onChange={(e) => onTo(e.target.value)} />
              </div>
              <div className="mt-8 grid grid-cols-3 gap-3" aria-live="polite">
                {[["Время", timeLabel], ["Добавит", fmt(km) + " км"], ["Стоимость", fmt(cost) + " ₸"]].map(([k, v]) => (
                  <div key={k} className="liquid-glass rounded-[1rem] p-4 min-w-0">
                    <div className="text-xs text-white/60">{k}</div>
                    <div className="font-heading italic text-2xl md:text-3xl leading-none mt-2 break-words">{v}</div>
                  </div>
                ))}
              </div>
              <p className="mt-4 text-xs text-white/50">Расчёт примерный: тариф {TARIFF} ₸ за кВт·ч, после 80% зарядка замедляется.</p>
            </form>
          </Reveal>
        </div>
      </section>
    );
  }
  window.Charging = Charging;
</script>
