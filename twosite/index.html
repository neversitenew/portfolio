  @keyframes fade-rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .animate-fade-rise { animation: fade-rise 0.8s ease-out both; }
  .animate-fade-rise-delay { animation: fade-rise 0.8s ease-out 0.2s both; }

  /* Hero scene: painted plain under the video, fallback gradient if WebGL is off */
  .meadow-bg { background: linear-gradient(180deg, #dfe4ea 0%, #eef0ef 46%, #9aa38a 54%, #5f6b4f 100%); }
  .meadow-canvas { opacity: 0; transition: opacity 1.4s ease; }
  .meadow-canvas.is-on { opacity: 1; }
  .word { display: inline-block; animation: fade-rise 0.9s cubic-bezier(.2,.7,.2,1) both; }

  /* Scroll reveal */
  .reveal { opacity: 0; transform: translateY(28px); transition: opacity 0.9s cubic-bezier(.2,.7,.2,1), transform 0.9s cubic-bezier(.2,.7,.2,1); }
  .reveal.is-in { opacity: 1; transform: none; }

  @keyframes scroll-dot { 0% { transform: translateY(0); opacity: 1; } 70% { transform: translateY(14px); opacity: 0; } 100% { transform: translateY(0); opacity: 0; } }
  .scroll-dot { animation: scroll-dot 1.8s ease-in-out infinite; }
  .tilt { position: relative; transition: transform 0.35s cubic-bezier(.2,.7,.2,1), box-shadow 0.35s ease, border-color 0.3s ease, background-color 0.3s ease; will-change: transform; }
  .tilt::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity 0.35s ease;
    background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,0.7), rgba(255,255,255,0) 45%); }
  .tilt:hover { box-shadow: 0 30px 60px -30px rgba(0,0,0,0.28); }
  .tilt:hover::after { opacity: 1; }
  .tooth-card { background: radial-gradient(120% 90% at 50% 20%, #ffffff 0%, #eef0f2 55%, #e2e5e8 100%); }
  .fact-circle { transition: background-color 0.5s ease, color 0.5s ease, transform 0.5s cubic-bezier(.2,.7,.2,1), border-color 0.5s ease; }
  .fact-circle:hover { background: #000; color: #fff; border-color: #000; transform: scale(1.04); }
  .fact-circle:hover .fact-label { color: rgba(255,255,255,0.7); }
  .foot-link .arrow { transition: transform 0.3s ease; }
  .foot-link:hover .arrow { transform: translate(6px, -6px); }

  .acc { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.35s ease; }

  .acc > div { overflow: hidden; }

  const MEADOW_FRAG = `precision highp float;
uniform vec2 uRes;
uniform float uTime;

float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
}
float fbm(vec2 p){
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++){ v += a * noise(p); p = p * 2.03 + vec2(1.7, 9.2); a *= 0.5; }
  return v;
}

void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  float aspect = uRes.x / uRes.y;
  float t = uTime;
  float hz = 0.52;                       // horizon height

  // Sky: pale, slightly cool, warmer near the sun
  vec3 skyTop = vec3(0.84, 0.87, 0.90);
  vec3 skyLow = vec3(0.95, 0.95, 0.94);
  vec3 col = mix(skyLow, skyTop, smoothstep(hz, 1.0, uv.y));
  vec2 sunP = vec2(0.24, hz + 0.16);
  float sd = length((uv - sunP) * vec2(aspect, 1.0));
  col += vec3(1.0, 0.96, 0.88) * (0.22 * exp(-sd * 3.2) + 0.08 * exp(-sd * 0.9));

  // Drifting clouds
  vec2 cp = vec2(uv.x * aspect * 1.4 + t * 0.012, uv.y * 3.2);
  float cl = fbm(cp + vec2(0.0, t * 0.004));
  cl = smoothstep(0.52, 0.85, cl) * smoothstep(hz + 0.04, hz + 0.3, uv.y);
  col = mix(col, vec3(0.98, 0.98, 0.97), cl * 0.55);

  // Distant hills, two hazy layers
  float x = uv.x * aspect;
  float h1 = hz + 0.12 * fbm(vec2(x * 0.75, 2.0)) - 0.005;

      const st = { yaw: 0.6, pitch: 0.18, vy: 0, imp: target.current.imp, white: target.current.white, drag: false, lx: 0, ly: 0, last: 0 };
      let raf = 0, visible = true;
      const draw = (now) => {
        const dpr = Math.min(window.devicePixelRatio || 1, 1.75);
        const w = Math.max(1, Math.floor(c.clientWidth * dpr)), h = Math.max(1, Math.floor(c.clientHeight * dpr));
        if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
        gl.viewport(0, 0, w, h);
        gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
        gl.uniform2f(uRes, w, h); gl.uniform1f(uTime, now / 1000);
        gl.uniform2f(uRot, st.yaw, st.pitch); gl.uniform1f(uImp, st.imp); gl.uniform1f(uWhite, st.white);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      };
      const loop = (now) => {
        const tg = target.current;
        st.imp += (tg.imp - st.imp) * 0.12; st.white += (tg.white - st.white) * 0.1;
        if (!st.drag) {
          st.yaw += st.vy; st.vy *= 0.94;
          if (!reduce && now - st.last > 2200) st.yaw += 0.005;
        }
        draw(now);
        if (visible) raf = requestAnimationFrame(loop);
      };
      const down = (e) => { st.drag = true; st.lx = e.clientX; st.ly = e.clientY; st.vy = 0; c.setPointerCapture && c.setPointerCapture(e.pointerId); };
      const move = (e) => {
        if (!st.drag) return;
        const dx = e.clientX - st.lx, dy = e.clientY - st.ly; st.lx = e.clientX; st.ly = e.clientY;
        st.yaw += dx * 0.012; st.vy = dx * 0.012;
        if (e.pointerType === "mouse") st.pitch = Math.max(-0.7, Math.min(0.9, st.pitch + dy * 0.008));
      };
      const up = () => { st.drag = false; st.last = performance.now(); };
      c.addEventListener("pointerdown", down); c.addEventListener("pointermove", move);
      c.addEventListener("pointerup", up); c.addEventListener("pointercancel", up);
      const io = new IntersectionObserver(([e]) => { visible = e.isIntersecting; cancelAnimationFrame(raf); if (visible) raf = requestAnimationFrame(loop); });
      io.observe(c);
      raf = requestAnimationFrame(loop);
      return () => { cancelAnimationFrame(raf); io.disconnect(); c.removeEventListener("pointerdown", down); c.removeEventListener("pointermove", move); c.removeEventListener("pointerup", up); c.removeEventListener("pointercancel", up); };
    }, []);
    return (
      <div className="tooth-card relative rounded-[2rem] border border-black/10 overflow-hidden h-[380px] md:h-[440px]">
        <canvas ref={ref} role="img" aria-label={aria} className="absolute inset-0 w-full h-full cursor-grab active:cursor-grabbing" style={{ touchAction: "pan-y" }}></canvas>
        <div className="absolute left-5 top-5 right-5 flex justify-between gap-3 pointer-events-none">
          <span key={label} className="animate-fade-rise rounded-full bg-white/80 backdrop-blur px-4 py-2 text-sm text-black border border-black/10">{label}</span>
        </div>
        <div className="absolute left-1/2 -translate-x-1/2 bottom-5 rounded-full bg-white/80 backdrop-blur px-4 py-2 text-xs text-mute border border-black/10 pointer-events-none whitespace-nowrap">↔ {hint}</div>
      </div>
    );
  }

  function Tilt({ as, className, children, max, ...rest }) {
    const ref = React.useRef(null);
    const ok = React.useMemo(() => window.matchMedia("(hover: hover) and (pointer: fine)").matches && !window.matchMedia("(prefers-reduced-motion: reduce)").matches, []);
    const m = max || 5;
    const onMove = (e) => {
      const el = ref.current; if (!el) return;
      const r = el.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      el.style.setProperty("--mx", (x * 100).toFixed(1) + "%"); el.style.setProperty("--my", (y * 100).toFixed(1) + "%");
      if (ok) el.style.transform = "perspective(1000px) rotateX(" + ((0.5 - y) * m).toFixed(2) + "deg) rotateY(" + ((x - 0.5) * m).toFixed(2) + "deg) translateY(-4px)";
    };
    const onLeave = () => { if (ref.current) ref.current.style.transform = ""; };
    const Tag = as || "div";
    return <Tag ref={ref} onPointerMove={onMove} onPointerLeave={onLeave} className={"tilt " + (className || "")} {...rest}>{children}</Tag>;
  }

  function Icon({ name }) {
    const common = { width: 26, height: 26, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 1.5, strokeLinecap: "round", strokeLinejoin: "round", "aria-hidden": true };
    if (name === "microscope") return <svg {...common}><path d="M9.5 3h3v7h-3z" /><path d="M11 10v2.5" /><path d="M6 21h12" /><path d="M9 17.5h6" /><path d="M14.5 8.5a5.5 5.5 0 0 1-2.5 9" /></svg>;
    if (name === "cube") return <svg {...common}><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z" /><path d="M12 12l8-4.5" /><path d="M12 12v9" /><path d="M12 12L4 7.5" /></svg>;
    return <svg {...common}><circle cx="12" cy="12" r="8.5" /><path d="M12 7.5V12l3 2" /></svg>;
  }

  function Studio() {
    const { t } = useLang();
    const S = t.studio;
    const [sel, setSel] = React.useState(0);
    const pick = (i) => () => setSel(i);
    const key = (i) => (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setSel(i); } };
    return (
      <section id="services" className="bg-white">
        <div className="gutter">
          <div className="max-w-7xl mx-auto py-28 md:py-36 grid md:grid-cols-[minmax(0,5fr)_minmax(0,7fr)] gap-10 md:gap-14">
            <div className="md:sticky md:top-24 self-start min-w-0">
              <Reveal>
                <Eyebrow>{S.eyebrow}</Eyebrow>
                <h2 className="font-display font-normal text-black text-5xl sm:text-6xl mt-5" style={{ lineHeight: 0.98, letterSpacing: "-0.025em", textWrap: "balance" }}>
                  {S.h[0]}<em className="italic text-mute">{S.h[1]}</em>
                </h2>
                <p className="mt-6 text-base sm:text-lg text-mute leading-relaxed max-w-md">{S.p}</p>
              </Reveal>
              <Reveal delay={0.15} className="mt-8">
                <ToothViewer mode={sel} label={t.services[sel].view} hint={t.drag} aria={t.toothAria} />
              </Reveal>
            </div>
            <div className="min-w-0 grid gap-4 content-start">
              {t.services.map((s, i) => (
                <Reveal key={i} delay={i * 0.1}>
                  <Tilt as="article" role="button" tabIndex={0} aria-pressed={sel === i}
                    onMouseEnter={pick(i)} onFocus={pick(i)} onClick={pick(i)} onKeyDown={key(i)}
                    className={"rounded-[1.75rem] border bg-white p-7 md:p-8 cursor-pointer overflow-hidden " + (sel === i ? "border-black" : "border-black/15")}>
                    <div className="flex flex-wrap items-start justify-between gap-x-6 gap-y-3">
                      <h3 className="font-display text-4xl md:text-[2.75rem] text-black leading-none tracking-tight">{s.name}</h3>
                      <span className={"rounded-full px-4 py-2 text-sm whitespace-nowrap tabular-nums transition-colors " + (sel === i ? "bg-black text-white" : "border border-black/15 text-black")}>{s.metric}</span>
                    </div>
                    <p className="mt-4 text-base text-mute leading-relaxed max-w-xl">{s.text}</p>
                    <div className="mt-6 flex flex-wrap items-end justify-between gap-4">
                      <ul className="flex flex-wrap gap-2" aria-label={S.aria}>
                        {s.tags.map((x) => <li key={x} className="rounded-full bg-[#f2f3f4] text-xs text-black px-3 py-1.5">{x}</li>)}
                      </ul>
                      <span className="text-xs text-mute">{s.metricLabel}</span>
                    </div>
                  </Tilt>
                </Reveal>
              ))}
            </div>
          </div>
        </div>
      </section>
    );
  }

  function Manifesto({ text }) {
    const ref = React.useRef(null);
    React.useEffect(() => {
      const root = ref.current;
      const words = Array.from(root.querySelectorAll("[data-w]"));
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let raf = 0;
      const update = () => {
        raf = 0;
        const r = root.getBoundingClientRect(), vh = window.innerHeight;
        const p = reduce ? 1 : Math.min(1, Math.max(0, (vh * 0.9 - r.top) / (r.height + vh * 0.2)));
        const lit = Math.round(p * words.length * 1.1);
        words.forEach((w, i) => { w.style.color = i < lit ? "#000000" : "#6F6F6F"; });
      };
      const onScroll = () => { if (!raf) raf = requestAnimationFrame(update); };
      update();
      window.addEventListener("scroll", onScroll, { passive: true });
      window.addEventListener("resize", onScroll);
      return () => { window.removeEventListener("scroll", onScroll); window.removeEventListener("resize", onScroll); cancelAnimationFrame(raf); };
    }, [text]);
    return (
      <p ref={ref} className="font-display text-black text-4xl sm:text-5xl md:text-6xl max-w-5xl" style={{ lineHeight: 1.05, letterSpacing: "-0.02em" }}>
        {text.split(" ").map((w, i) => <span key={i} data-w style={{ color: "#6F6F6F", transition: "color 0.3s ease" }}>{w}{" "}</span>)}
      </p>
    );
  }

  function About() {
    const { t } = useLang();
    return (
      <section id="clinic" className="bg-white border-t border-black/10">
        <div className="gutter">
          <div className="max-w-7xl mx-auto py-28 md:py-36">
            <Reveal>
              <Eyebrow>{t.about.eyebrow}</Eyebrow>
              <div className="mt-8"><Manifesto text={t.about.manifesto} /></div>
            </Reveal>
            <div className="mt-16 grid gap-4 md:grid-cols-3">
              {t.about.features.map(([icon, title, text], i) => (
                <Reveal key={i} delay={i * 0.1}>
                  <Tilt className="h-full rounded-[1.75rem] bg-[#f4f5f6] border border-transparent hover:border-black/10 p-8 overflow-hidden">
                    <span className="grid place-items-center h-14 w-14 rounded-full bg-white border border-black/10 text-black"><Icon name={icon} /></span>
                    <h3 className="mt-8 font-display text-3xl text-black leading-none tracking-tight">{title}</h3>
                    <p className="mt-3 text-base text-mute leading-relaxed">{text}</p>
                  </Tilt>
                </Reveal>
              ))}
            </div>
            <dl className="mt-16 grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
              {t.about.facts.map(([n, l], i) => (
                <Reveal key={i} delay={i * 0.1} className="min-w-0">
                  <div className="fact-circle mx-auto w-full max-w-[260px] aspect-square rounded-full border border-black/15 text-black grid place-items-center text-center p-5">
                    <div>
                      <dt className="font-display text-5xl md:text-6xl leading-none tabular-nums"><CountUp value={n} /></dt>
                      <dd className="fact-label mt-3 text-xs md:text-sm text-mute max-w-[14ch] mx-auto leading-snug transition-colors">{l}</dd>
                    </div>
                  </div>
                </Reveal>
              ))}
            </dl>
          </div>
        </div>
      </section>
    );
  }

  function Journal() {
    const { t } = useLang();
    const J = t.journal;
    const [open, setOpen] = React.useState(0);
    return (
      <section id="faq" className="bg-white border-t border-black/10">
        <div className="gutter">
          <div className="max-w-7xl mx-auto py-28 md:py-36">
            <Reveal className="flex flex-wrap items-end justify-between gap-6">
              <div>
                <Eyebrow>{J.eyebrow}</Eyebrow>
                <h2 className="font-display font-normal text-black text-5xl sm:text-6xl mt-5" style={{ lineHeight: 0.98, letterSpacing: "-0.025em" }}>
                  {J.h[0]}<em className="italic text-mute">{J.h[1]}</em>
                </h2>
              </div>
              <p className="text-base text-mute max-w-sm leading-relaxed">{J.p}</p>
            </Reveal>
            <div className="mt-14 grid gap-3">
              {J.posts.map((p, i) => {
                const isOpen = open === i;
                return (
                  <Reveal key={i} delay={i * 0.08}>
                    <div className={"rounded-[1.5rem] border px-6 md:px-8 transition-colors duration-300 " + (isOpen ? "bg-[#f4f5f6] border-transparent" : "bg-white border-black/15 hover:border-black")}>
                      <h3>
                        <button type="button" aria-expanded={isOpen} aria-controls={"post-" + i} onClick={() => setOpen(isOpen ? -1 : i)}
                          className="w-full text-left py-6 grid grid-cols-[minmax(0,1fr)_auto] md:grid-cols-[160px_minmax(0,1fr)_auto] items-center gap-x-6 gap-y-2 group">
                          <span className="text-sm text-mute order-2 md:order-none col-span-2 md:col-span-1">{p.read ? p.date + " · " + p.read : p.date}</span>
                          <span className="font-display text-3xl md:text-5xl text-black leading-none tracking-tight group-hover:italic order-1 md:order-none">{p.title}</span>
                          <span className={"order-1 md:order-none grid place-items-center h-11 w-11 rounded-full text-xl leading-none transition-all duration-300 " + (isOpen ? "bg-black text-white rotate-45" : "border border-black/20 text-black")} aria-hidden="true">+</span>
                        </button>
                      </h3>
                      <div id={"post-" + i} className="acc" data-open={isOpen} role="region" aria-label={p.title}>
                        <div>
                          <p className="pb-7 md:pl-[184px] text-base md:text-lg text-mute leading-relaxed max-w-3xl">{p.text}</p>
                        </div>
                      </div>
                    </div>
                  </Reveal>
                );
              })}
            </div>
          </div>
        </div>
      </section>
    );
  }

  function Footer() {
    const { t } = useLang();
    const F = t.footer;
    return (
      <footer className="bg-white border-t border-black/10">
        <div className="gutter">
          <div className="max-w-7xl mx-auto py-10 flex flex-wrap items-center justify-between gap-x-10 gap-y-5">
            <Logo />
            <nav className="flex flex-wrap gap-x-7 gap-y-2" aria-label={t.navLabel}>
              {NAV_IDS.map((id, i) => <a key={id} href={"#" + id} className="text-sm text-mute hover:text-black transition-colors">{t.nav[i]}</a>)}
            </nav>
            <div className="w-full pt-5 border-t border-black/15 flex flex-wrap justify-between gap-x-8 gap-y-3 text-sm text-mute">
              <span>{F.note}</span>
              <a href="#home" className="hover:text-black transition-colors">{F.top}</a>
            </div>
          </div>
        </div>
      </footer>
    );
  }

  function initialLang() {
    try { const v = localStorage.getItem("lumera-lang"); if (v === "en" || v === "ru") return v; } catch (e) {}
    return (navigator.language || "en").toLowerCase().indexOf("ru") === 0 ? "ru" : "en";
  }

  function App() {
    const [lang, setLangState] = React.useState(initialLang);
    const setLang = (l) => { setLangState(l); try { localStorage.setItem("lumera-lang", l); } catch (e) {} };
    React.useEffect(() => { document.documentElement.lang = lang; }, [lang]);
    const ctx = React.useMemo(() => ({ lang, t: T[lang], setLang }), [lang]);
    const active = useActiveSection();
    return (
      <LangCtx.Provider value={ctx}>
        <Header active={active} />
        <main>
          <Hero />
          <Studio />
          <About />
          <Journal />
        </main>
        <Footer />
      </LangCtx.Provider>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
