<style>
  /* Layout: dark bottle-green page. Hero pairs the headline with a raymarched 3D plate and silver cloche; Menu pins the plate while three dish cards swap what is under the lid. Story and Visit stay quiet.
     Palette: bottle black-green ground, ivory text, sage grey, one brass accent. Single dark look by choice. */
  :root { --bg: #0f1511; --panel: #161e18; --ink: #f0ece2; --mute: #98a094; --brass: #c9a867; --line: rgba(240,236,226,0.14); --font-display: 'Instrument Serif', Georgia, serif; color-scheme: dark; }
  /* Instrument Serif has no Cyrillic, so Russian uses Playfair Display for headings */
  html[lang="ru"] { --font-display: 'Playfair Display', Georgia, serif; }
  html[lang="ru"] .font-display { font-feature-settings: "lnum"; }
  html[lang="ru"] h1.font-display, html[lang="ru"] h2.font-display { line-height: 1.04 !important; letter-spacing: -0.018em !important; }
  html { scroll-behavior: smooth; background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: clip; }
  section[id], footer[id] { scroll-margin-top: 72px; }
  .gutter { padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; border-radius: 6px; }

  @keyframes fade-rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .animate-fade-rise { animation: fade-rise 0.8s ease-out both; }
  .animate-fade-rise-delay { animation: fade-rise 0.8s ease-out 0.2s both; }
  .animate-fade-rise-delay-2 { animation: fade-rise 0.8s ease-out 0.4s both; }
  .word { display: inline-block; animation: fade-rise 0.9s cubic-bezier(.2,.7,.2,1) both; }

  .reveal { opacity: 0; transform: translateY(28px); transition: opacity 0.9s cubic-bezier(.2,.7,.2,1), transform 0.9s cubic-bezier(.2,.7,.2,1); }
  .reveal.is-in { opacity: 1; transform: none; }

  .tilt { position: relative; transition: transform 0.35s cubic-bezier(.2,.7,.2,1), box-shadow 0.35s ease, border-color 0.3s ease, background-color 0.3s ease; will-change: transform; }
  .tilt::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity 0.35s ease;
    background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%), rgba(201,168,103,0.16), rgba(201,168,103,0) 45%); }
  .tilt:hover { box-shadow: 0 30px 60px -30px rgba(0,0,0,0.8); }
  .tilt:hover::after { opacity: 1; }

  .menu-row { transition: padding-left 0.35s cubic-bezier(.2,.7,.2,1); }
  .menu-row:hover { padding-left: 10px; }
  .plate-stage { background: radial-gradient(70% 60% at 50% 62%, #243126 0%, #172019 55%, #121912 100%); }
  .fact-circle { transition: background-color 0.5s ease, color 0.5s ease, transform 0.5s cubic-bezier(.2,.7,.2,1), border-color 0.5s ease; }
  .fact-circle:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); transform: scale(1.04); }
  .fact-circle:hover .fact-label { color: rgba(15,21,17,0.7); }
  @keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .nudge { animation: nudge 2.4s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .animate-fade-rise, .animate-fade-rise-delay, .animate-fade-rise-delay-2, .word, .nudge { animation: none; }
    .reveal { opacity: 1; transform: none; transition: none; }
    .tilt, .fact-circle { transition: none; }
    .fact-circle:hover { transform: none; }
  }
</style>

<script type="text/babel" data-presets="react">
  const NAV_IDS = ["home", "menu", "story", "visit"];

  const T = {
    en: {
      nav: ["Home", "Menu", "Story", "Visit"], navLabel: "Main", menuBtn: "Menu", close: "Close", cta: "See the menu",
      hero: { eyebrow: "Seasonal kitchen", h: ["Dinner, served ", "under glass."], p: "Seasonal plates from a small kitchen. Lift the lid and see.", drag: "Drag to rotate", lift: "Lift the lid", cover: "Cover", aria: "3D plate with a silver cloche. Drag to rotate." },
      menu: { eyebrow: "Menu", h: ["A menu for ", "every day."], p: "Seven sections, from starters to cold drinks. Pick a section and the dish appears under the lid.", drag: "Drag to rotate", items: "items" },

        hours: [["Monday to Thursday", "12:00 to 23:00"], ["Friday and Saturday", "12:00 to 01:00"], ["Sunday", "12:00 to 22:00"]],

    },
    ru: {
      nav: ["Главная", "Меню", "История", "Визит"], navLabel: "Основное меню", menuBtn: "Меню", close: "Закрыть", cta: "Смотреть меню",
      hero: { eyebrow: "Сезонная кухня", h: ["Ужин, поданный ", "под клошем."], p: "Сезонные блюда из маленькой кухни. Поднимите крышку и посмотрите.", drag: "Потяните, чтобы повернуть", lift: "Поднять крышку", cover: "Накрыть", aria: "3D-тарелка с серебряным клошем. Потяните, чтобы повернуть." },
      menu: { eyebrow: "Меню", h: ["Меню на ", "каждый день."], p: "Семь разделов, от закусок до холодных напитков. Выберите раздел, и блюдо появится под крышкой.", drag: "Потяните, чтобы повернуть", items: "позиций" },
      story: { eyebrow: "История",
        manifesto: "Olea открылась в 2026 году в Старом городе. Сезонные продукты, открытая кухня и блюда, которые подают так, как дарят подарок.",
        facts: [["2026", "год открытия"], ["40", "мест в зале"], ["37", "позиций в меню"], ["7", "дней в неделю"]] },
      visit: { eyebrow: "Визит", h: ["Без бронирования. ", "Просто приходите."], p: "Заходите, садитесь и доверьте темп кухне.",
        hours: [["Понедельник — четверг", "12:00–23:00"], ["Пятница и суббота", "12:00–01:00"], ["Воскресенье", "12:00–22:00"]],
        place: "Старый город, первый этаж, за зелёной дверью." },
      footer: { note: "© 2026 Olea. Вымышленный ресторан, концепт-страница для портфолио.", top: "Наверх ↑" }
    }
  };

  const LangCtx = React.createContext({ lang: "en", t: T.en, setLang: () => {} });
  const useLang = () => React.useContext(LangCtx);

  const PLATE_FRAG = `precision highp float;
uniform vec2 uRes;
uniform float uTime;
uniform vec2 uRot;    // yaw, pitch
uniform float uLift;  // 0 closed .. 1 lifted
uniform float uDish;  // 0 salad, 1 soup, 2 steak, 3 cheesecake, 4 coffee, 5 lemonade

const float PI = 3.14159265;

vec2 U(vec2 a, vec2 b){ return a.x < b.x ? a : b; }
float smin(float a, float b, float k){ float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0); return mix(b, a, h) - k * h * (1.0 - h); }
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
float sdEll(vec3 p, vec3 r){ float k0 = length(p / r); float k1 = length(p / (r * r)); return k0 * (k0 - 1.0) / k1; }
float sdRoundCyl(vec3 p, float r, float h, float rr){ vec2 d = vec2(length(p.xz) - r + rr, abs(p.y) - h + rr); return min(max(d.x, d.y), 0.0) + length(max(d, 0.0)) - rr; }
float sdTorus(vec3 p, vec2 t){ vec2 q = vec2(length(p.xz) - t.x, p.y); return length(q) - t.y; }
float sdBox(vec3 p, vec3 b){ vec3 q = abs(p) - b; return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0); }
float sdCapsule(vec3 p, vec3 a, vec3 b, float r){ vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); return length(pa - ba * h) - r; }
float hash(float n){ return fract(sin(n * 12.9898) * 43758.5453); }

// curved leaf: flattened ellipsoid, yaw a, pitch tilt, cupped
float leaf(vec3 p, vec3 pos, float a, float tilt, vec3 r, float cup){
  vec3 q = p - pos;
  q.xz = rot(a) * q.xz;
  q.xy = rot(tilt) * q.xy;
  q.y -= cup * (q.x * q.x + 0.6 * q.z * q.z);
  q.y += 0.004 * sin(q.x * 38.0 + q.z * 9.0);
  return sdEll(q, r) * 0.8;
}

vec2 plate(vec3 p){
  float base = sdRoundCyl(p - vec3(0.0, 0.03, 0.0), 1.55, 0.03, 0.025);
  float rim = sdTorus(p - vec3(0.0, 0.07, 0.0), vec2(1.43, 0.045));
  return vec2(smin(base, rim, 0.05), 1.0);
}

vec2 cloche(vec3 p){
  float L = uLift;
  vec3 q = p - vec3(0.0, 0.06, 0.0);
  q -= vec3(L * 1.35, L * 1.6, 0.0);
  q.xy = rot(L * 0.5) * q.xy;
  float e = sdEll(q, vec3(1.2, 1.0, 1.2));
  float shell = max(abs(e) - 0.016, -q.y);
  float rimR = sdTorus(q - vec3(0.0, 0.012, 0.0), vec2(1.19, 0.026));
  float knob = length(q - vec3(0.0, 1.04, 0.0)) - 0.095;
  float neck = sdRoundCyl(q - vec3(0.0, 0.99, 0.0), 0.04, 0.05, 0.012);
  float d = smin(shell, rimR, 0.025);
  d = smin(d, smin(knob, neck, 0.04), 0.05);
  return vec2(d, 2.0);
}

/* ---------- 0: garden salad ---------- */
vec2 salad(vec3 p){
  vec2 res = vec2(1e3, 0.0);
  for (int i = 0; i < 11; i++){
    float fi = float(i);
    float a = fi * 2.39996 + 0.3;
    float r = 0.06 + 0.062 * fi;
    vec3 pos = vec3(cos(a) * r, 0.36 - r * 0.38 + 0.03 * hash(fi), sin(a) * r);
    float l = leaf(p, pos, a, -0.2 - r * 0.7, vec3(0.27, 0.022, 0.16), 1.1);
    res = U(res, vec2(l, mod(fi, 2.0) < 0.5 ? 5.0 : 11.0));
  }
  float tom = 1e3;
  for (int i = 0; i < 4; i++){
    float a = float(i) * 1.5708 + 0.4;
    vec3 c = vec3(cos(a) * 0.5, 0.2, sin(a) * 0.5);
    vec3 q = p - c; q.xy = rot(0.5) * q.xy;
    tom = min(tom, max(length(q) - 0.11, -q.y));
  }
  res = U(res, vec2(tom, 10.0));
  float ch = 1e3;
  for (int i = 0; i < 4; i++){
    float a = float(i) * 1.5708 + 1.2;
    vec3 q = p - vec3(cos(a) * 0.32, 0.3, sin(a) * 0.32);
    q.xz = rot(a * 1.7) * q.xz;
    ch = min(ch, sdBox(q, vec3(0.045)) - 0.012);
  }
  res = U(res, vec2(ch, 3.0));
  float cr = 1e3;
  for (int i = 0; i < 3; i++){
    float a = float(i) * 2.0944 + 2.1;
    vec3 q = p - vec3(cos(a) * 0.62, 0.11, sin(a) * 0.62);
    q.xz = rot(a) * q.xz; q.xy = rot(0.3) * q.xy;
    cr = min(cr, sdBox(q, vec3(0.05, 0.045, 0.05)) - 0.015);
  }
  res = U(res, vec2(cr, 12.0));
  return res;
}

/* ---------- 1: pumpkin soup in a glazed bowl ---------- */
vec2 soup(vec3 p){
  vec3 c = vec3(0.0, 0.62, 0.0);
  float outer = sdEll(p - c, vec3(0.86, 0.62, 0.86));
  float bowl = max(abs(outer) - 0.03, p.y - 0.48);
  bowl = smin(bowl, sdRoundCyl(p - vec3(0.0, 0.03, 0.0), 0.36, 0.03, 0.012), 0.03);
  vec2 res = vec2(bowl, 14.0);
  float fill = max(sdEll(p - c, vec3(0.82, 0.58, 0.82)), p.y - 0.41);
  res = U(res, vec2(fill, 13.0));
  // cream swirl
  vec3 s = p - vec3(0.05, 0.41, -0.02);
  float ang = atan(s.z, s.x);
  float rr = length(s.xz);
  float sp = abs(fract((rr - 0.04 * ang) / 0.25 + 0.5) - 0.5) * 0.25;
  float swirl = max(sqrt(sp * sp + s.y * s.y) - 0.022, rr - 0.45);
  res = U(res, vec2(swirl * 0.8, 3.0));
  float seeds = 1e3;
  for (int i = 0; i < 6; i++){
    float a = float(i) * 1.047 + 0.5;
    vec3 q = p - vec3(cos(a) * 0.55, 0.42, sin(a) * 0.55);
    q.xz = rot(a * 2.3) * q.xz;
    seeds = min(seeds, sdEll(q, vec3(0.05, 0.016, 0.028)));
  }
  res = U(res, vec2(seeds, 11.0));
  float cr = 1e3;
  for (int i = 0; i < 3; i++){
    float a = float(i) * 2.1 + 1.0;
    vec3 q = p - vec3(cos(a) * 0.3, 0.44, sin(a) * 0.3);
    q.xz = rot(a) * q.xz;
    cr = min(cr, sdBox(q, vec3(0.045)) - 0.012);
  }
  res = U(res, vec2(cr, 12.0));
  float herb = leaf(p, vec3(-0.25, 0.43, 0.12), 0.8, 0.0, vec3(0.1, 0.012, 0.06), 0.8);
  herb = min(herb, leaf(p, vec3(-0.15, 0.43, 0.22), -0.6, 0.0, vec3(0.09, 0.012, 0.055), 0.8));
  res = U(res, vec2(herb, 5.0));
  // bread on the side
  vec3 b = p - vec3(0.98, 0.08, -0.35); b.xz = rot(0.9) * b.xz;
  res = U(res, vec2(sdEll(b, vec3(0.3, 0.09, 0.14)), 12.0));
  return res;
}

/* ---------- 2: sliced steak ---------- */
vec4 steakInfo(vec3 p){
  float best = 1e3; vec3 bl = vec3(0.0);
  for (int i = 0; i < 5; i++){
    float fi = float(i);
    vec3 lc = p - vec3(0.12, 0.0, 0.18);
    lc.xz = rot(0.55) * lc.xz;
    lc.x -= -0.38 + 0.19 * fi;
    lc.xy = rot(0.3) * lc.xy;
    lc.y -= 0.13;
    float d = sdBox(lc, vec3(0.045, 0.1, 0.31)) - 0.03;
    if (d < best){ best = d; bl = lc; }
  }
  return vec4(best, bl);
}
vec2 steak(vec3 p){
  vec2 res = vec2(steakInfo(p).x, 15.0);
  vec3 m = p - vec3(-0.42, 0.12, -0.45); m.xz = rot(0.7) * m.xz;
  float mash = sdEll(m, vec3(0.3, 0.15, 0.17));
  mash += 0.008 * sin(m.x * 30.0) * sin(m.z * 26.0);
  res = U(res, vec2(mash, 16.0));
  float jus = sdRoundCyl(p - vec3(0.15, 0.006, 0.12), 0.72 + 0.06 * sin(atan(p.z - 0.12, p.x - 0.15) * 3.0), 0.01, 0.007);
  res = U(res, vec2(jus, 17.0));
  float tom = 1e3;
  tom = min(tom, length(p - vec3(0.62, 0.1, -0.5)) - 0.1);
  tom = min(tom, length(p - vec3(0.78, 0.1, -0.3)) - 0.095);
  tom = min(tom, length(p - vec3(0.45, 0.1, -0.68)) - 0.09);
  res = U(res, vec2(tom, 10.0));
  float stem = sdCapsule(p, vec3(0.45, 0.2, -0.68), vec3(0.78, 0.2, -0.3), 0.012);
  float r1 = leaf(p, vec3(0.05, 0.36, 0.15), 0.4, 0.2, vec3(0.16, 0.012, 0.03), 0.0);
  float r2 = leaf(p, vec3(0.12, 0.37, 0.05), 1.2, 0.25, vec3(0.14, 0.012, 0.028), 0.0);
  res = U(res, vec2(min(stem, min(r1, r2)), 5.0));
  return res;
}

/* ---------- 3: cheesecake slice ---------- */
vec2 cake(vec3 p){
  vec3 l = p - vec3(-0.6, 0.0, 0.0);
  l.xz = rot(-0.2) * l.xz;
  float cyl = sdRoundCyl(l - vec3(0.0, 0.25, 0.0), 1.0, 0.25, 0.03);
  float h = 0.36;
  float wedge = max(dot(l.xz, vec2(-sin(h), cos(h))), dot(l.xz, vec2(-sin(h), -cos(h))));
  float d = max(cyl, wedge);
  d = max(d, 0.08 - l.x);
  vec2 res = vec2(d, 18.0);
  float ber = 1e3;
  for (int i = 0; i < 5; i++){
    float fi = float(i);
    vec3 c = vec3(0.35 + 0.12 * fi, 0.55, (hash(fi + 3.0) - 0.5) * 0.12 * fi * 0.5);
    vec3 lc = l - c;
    ber = min(ber, length(lc) - 0.06);
  }
  res = U(res, vec2(ber, 19.0));
  vec3 rp = l - vec3(0.62, 0.58, 0.06);
  float rasp = length(rp) - 0.075 + 0.008 * sin(rp.x * 60.0) * sin(rp.y * 60.0) * sin(rp.z * 60.0);
  res = U(res, vec2(rasp, 10.0));
  float mt = leaf(p, vec3(0.0, 0.58, -0.12), 1.1, 0.4, vec3(0.13, 0.014, 0.075), 0.9);
  res = U(res, vec2(mt, 5.0));
  vec3 sw = p - vec3(0.15, 0.004, 0.72); sw.xz = rot(0.35) * sw.xz;
  float swoosh = sdEll(sw, vec3(0.5, 0.014, 0.065));
  float dots = 1e3;
  for (int i = 0; i < 3; i++){ dots = min(dots, length(p - vec3(-0.62 + 0.15 * float(i), 0.02, 0.55 + 0.06 * float(i))) - 0.035); }
  res = U(res, vec2(min(swoosh, dots), 10.0));
  return res;
}

/* ---------- 4: cappuccino ---------- */
vec2 coffee(vec3 p){
  float saucer = sdRoundCyl(p - vec3(0.0, 0.025, 0.0), 0.68, 0.025, 0.02);
  saucer = smin(saucer, sdTorus(p - vec3(0.0, 0.05, 0.0), vec2(0.62, 0.025)), 0.03);
  vec2 res = vec2(saucer, 1.0);
  float y = p.y;
  float r = 0.3 + 0.13 * clamp((y - 0.07) / 0.45, 0.0, 1.0);
  float outer = max(length(p.xz) - r, abs(y - 0.3) - 0.23);
  float inner = max(length(p.xz) - (r - 0.03), abs(y - 0.36) - 0.23);
  float cup = max(outer, -inner);
  vec3 hq = p - vec3(0.43, 0.32, 0.0);
  float handle = max(sdTorus(vec3(hq.x, hq.z, hq.y), vec2(0.1, 0.026)), -(length(p.xz) - r + 0.01));
  cup = smin(cup, handle, 0.02);
  res = U(res, vec2(cup * 0.9, 14.0));
  float fill = max(length(p.xz) - (r - 0.025), max(y - 0.47, 0.12 - y));
  res = U(res, vec2(fill, 20.0));
  vec3 bq = p - vec3(-0.15, 0.08, 0.55); bq.xz = rot(-0.4) * bq.xz;
  float bis = sdBox(bq, vec3(0.22, 0.025, 0.06)) - 0.02;
  res = U(res, vec2(bis, 12.0));
  return res;
}

/* ---------- 5: lemonade ---------- */
vec2 lemonade(vec3 p){
  float rl = length(p.xz);
  float base = sdRoundCyl(p - vec3(0.0, 0.035, 0.0), 0.33, 0.035, 0.012);
  float rim = max(abs(rl - 0.32) - 0.012, abs(p.y - 0.665) - 0.055);
  vec2 res = vec2(min(base, rim), 21.0);
  float liq = sdRoundCyl(p - vec3(0.0, 0.34, 0.0), 0.33, 0.27, 0.02);
  res = U(res, vec2(liq, 22.0));

  for (int i = 0; i < 3; i++){
    float fi = float(i);
    float a = fi * 2.1 + 0.3;
    vec3 q = p - vec3(cos(a) * 0.14, 0.62 + 0.02 * fi, sin(a) * 0.14);
    q.xz = rot(a * 1.3) * q.xz; q.xy = rot(0.3 + fi) * q.xy;
    ice = min(ice, sdBox(q, vec3(0.075)) - 0.02);
  }
  res = U(res, vec2(ice, 23.0));
  vec3 lw = p - vec3(0.33, 0.68, 0.06);
  lw.xz = rot(0.2) * lw.xz;
  float wheel = sdRoundCyl(vec3(lw.y, lw.x, lw.z), 0.15, 0.022, 0.01);
  res = U(res, vec2(wheel, 24.0));
  float straw = sdCapsule(p, vec3(-0.06, 0.2, 0.04), vec3(-0.2, 0.86, 0.13), 0.022);
  res = U(res, vec2(straw, 25.0));
  float mint = leaf(p, vec3(-0.08, 0.7, -0.1), 0.5, 0.5, vec3(0.1, 0.012, 0.06), 0.9);
  mint = min(mint, leaf(p, vec3(0.02, 0.71, -0.14), -0.8, -0.4, vec3(0.09, 0.012, 0.055), 0.9));
  res = U(res, vec2(mint, 5.0));
  // lemon halves on the plate
  vec3 lh = p - vec3(0.75, 0.0, -0.45);
  float half1 = max(length(lh) - 0.2, -lh.y);
  half1 = max(half1, lh.y - 0.16);
  res = U(res, vec2(half1, 24.0));
  return res;
}

vec2 dishAt(vec3 q){
  if (uDish < 0.5) return salad(q);
  if (uDish < 1.5) return soup(q);
  if (uDish < 2.5) return steak(q);
  if (uDish < 3.5) return cake(q);
  if (uDish < 4.5) return coffee(q);
  return lemonade(q);
}

vec2 map(vec3 p){
  vec2 res = plate(p);
  res = U(res, cloche(p));
  vec3 q = p - vec3(0.0, 0.06, 0.0);
  if (length(q) < 1.7){
    vec2 d = dishAt(q);
    // everything stays inside the closed lid; the clip opens up as the lid lifts
    d.x = max(d.x, sdEll(q, vec3(1.13, 0.93, 1.13)) - uLift * 30.0);
    res = U(res, d);
  }
  return res;
}

vec3 normalAt(vec3 p){
  vec2 e = vec2(1.0, -1.0) * 0.0011;
  return normalize(e.xyy * map(p + e.xyy).x + e.yyx * map(p + e.yyx).x + e.yxy * map(p + e.yxy).x + e.xxx * map(p + e.xxx).x);
}

float shadow(vec3 ro, vec3 rd){
  float res = 1.0, t = 0.03;
  for (int i = 0; i < 28; i++){
    float h = map(ro + rd * t).x;
    res = min(res, 9.0 * h / t);
    t += clamp(h, 0.02, 0.25);
    if (res < 0.02 || t > 5.0) break;
  }
  return clamp(res, 0.0, 1.0);
}
float aoAt(vec3 p, vec3 n){
  float o = 0.0, s = 1.0;
  for (int i = 1; i <= 5; i++){ float h = 0.035 * float(i); o += (h - map(p + n * h).x) * s; s *= 0.72; }
  return clamp(1.0 - 2.4 * o, 0.0, 1.0);
}

mat3 rotY(float a){ float c = cos(a), s = sin(a); return mat3(c, 0.0, -s, 0.0, 1.0, 0.0, s, 0.0, c); }
mat3 rotX(float a){ float c = cos(a), s = sin(a); return mat3(1.0, 0.0, 0.0, 0.0, c, s, 0.0, -s, c); }

vec3 envMap(vec3 d){
  vec3 col = mix(vec3(0.045, 0.06, 0.05), vec3(0.34, 0.38, 0.35), smoothstep(-0.25, 0.95, d.y));
  float box = smoothstep(0.5, 0.18, length(vec2(d.x + 0.5, d.y - 0.62) * vec2(1.0, 1.15))) * smoothstep(-0.4, 0.2, d.z);
  col += vec3(1.0, 0.95, 0.86) * 3.2 * box;
  float strip = smoothstep(0.09, 0.0, abs(d.x - 0.82)) * smoothstep(0.95, 0.25, abs(d.y - 0.1)) * step(-0.2, d.z);
  col += vec3(0.85, 0.93, 1.0) * 1.8 * strip;
  float back = smoothstep(0.14, 0.0, abs(d.x + 0.9)) * smoothstep(0.7, 0.1, abs(d.y)) * 0.6;
  col += vec3(1.0, 0.85, 0.6) * back;
  col = mix(col, vec3(0.11, 0.08, 0.05), smoothstep(0.0, -0.45, d.y) * 0.85);
  return col;
}

float dot2(vec2 v){ return dot(v, v); }
float sdHeart(vec2 p){
  p.x = abs(p.x);
  if (p.y + p.x > 1.0) return sqrt(dot2(p - vec2(0.25, 0.75))) - sqrt(2.0) / 4.0;
  return sqrt(min(dot2(p - vec2(0.0, 1.0)), dot2(p - 0.5 * max(p.x + p.y, 0.0)))) * sign(p.x - p.y);
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / min(uRes.x, uRes.y * 0.95);

      if (tf > 0.0){

        float sh = shadow(fp + vec3(0.0, 0.03, 0.0), L1);
        float rr = length(fp.xz);
        float ao = exp(-max(rr - 1.5, 0.0) * 2.4) * 0.55;

  } else if (id < 21.5){           // glass
    alb = vec3(0.75, 0.86, 0.84); shin = 220.0; refl = 0.9;
  } else if (id < 22.5){           // lemonade seen through the glass
    float f = pow(1.0 - max(dot(n, v), 0.0), 2.0);
    alb = mix(vec3(1.0, 0.78, 0.25), vec3(0.95, 0.55, 0.1), f);

    vec2 face = vec2(lc.y, lc.z);
    if (abs(n.y) > 0.7 && q.y < 0.3){ face = (q - vec3(0.75, 0.16, -0.45)).xz; }
    float r = length(face);
    float a = atan(face.y, face.x);
    float seg = abs(fract(a * 8.0 / (2.0 * PI)) - 0.5);

  col = col / (1.0 + col * 0.25);
  col = pow(col, vec3(0.88));
  gl_FragColor = vec4(col, 1.0);
}

            </Reveal>
            <Reveal delay={0.12} className="min-w-0">
              <Tilt className="rounded-[1.75rem] border border-ink/15 bg-panel p-7 md:p-9 overflow-hidden">
                <dl className="grid gap-0">
                  {V.hours.map(([d, h], i) => (
                    <div key={i} className="flex flex-wrap items-baseline justify-between gap-x-6 gap-y-1 py-5 border-b border-ink/10 first:pt-0">
                      <dt className="text-base text-mute">{d}</dt>
                      <dd className="font-display text-3xl text-ink tabular-nums">{h}</dd>
                    </div>
                  ))}
                </dl>
                <p className="mt-6 text-base text-ink">{V.place}</p>
              </Tilt>
            </Reveal>
          </div>
        </div>
      </section>
    );
  }

  function Footer() {
    const { t } = useLang();
    return (
      <footer className="border-t border-ink/10">
        <div className="gutter">
          <div className="max-w-7xl mx-auto py-10 flex flex-wrap items-center justify-between gap-x-10 gap-y-5">
            <Logo />
            <nav className="flex flex-wrap gap-x-7 gap-y-2" aria-label={t.navLabel}>
              {NAV_IDS.map((id, i) => <a key={id} href={"#" + id} className="text-sm text-mute hover:text-ink transition-colors">{t.nav[i]}</a>)}
            </nav>
            <div className="w-full pt-5 border-t border-ink/15 flex flex-wrap justify-between gap-x-8 gap-y-3 text-sm text-mute">
              <span>{t.footer.note}</span>
              <a href="#home" className="hover:text-ink transition-colors">{t.footer.top}</a>
            </div>
          </div>
        </div>
      </footer>
    );
  }

  function initialLang() {
    try { const v = localStorage.getItem("olea-lang"); if (v === "en" || v === "ru") return v; } catch (e) {}
    return (navigator.language || "en").toLowerCase().indexOf("ru") === 0 ? "ru" : "en";
  }

  function App() {
    const [lang, setLangState] = React.useState(initialLang);
    const setLang = (l) => { setLangState(l); try { localStorage.setItem("olea-lang", l); } catch (e) {} };
    React.useEffect(() => { document.documentElement.lang = lang; }, [lang]);
    const ctx = React.useMemo(() => ({ lang, t: T[lang], setLang }), [lang]);
    const active = useActiveSection();
    return (
      <LangCtx.Provider value={ctx}>
        <Header active={active} />
        <main>
          <Hero />
          <MenuSection />
          <Story />
          <Visit />
        </main>
        <Footer />
      </LangCtx.Provider>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
